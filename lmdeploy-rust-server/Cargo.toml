[package]
name = "lmdeploy-server"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust API server for LMDeploy"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
parking_lot = "0.12"

# HTTP/gRPC
axum = { version = "0.7", features = ["http2"] }
tonic = { version = "0.12", features = ["tls"] }
tower = { version = "0.5", features = ["timeout", "load-shed", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Protobuf
prost = "0.13"

# Config
config = { version = "0.14", features = ["toml"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Tokenizers
tokenizers = "0.21"
splintr = { path = "../third_party/splintr", default-features = false, features = ["regexr-jit"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
sha256 = "1.5"
async-stream = "0.3"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
num_cpus = "1.16"
lru = "0.12"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
tabled = "0.16"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
assert-json-diff = "2.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bin]]
name = "diagnostic"
path = "src/bin/diagnostic.rs"

[[bin]]
name = "cpp_engine_test"
path = "bin/cpp_engine_test.rs"

[[bin]]
name = "cpp_4b_test"
path = "bin/cpp_4b_test.rs"

[[bin]]
name = "lmdeploy-server"
path = "src/main.rs"

[[bench]]
name = "benchmark"
harness = false

[build-dependencies]
tonic-build = "0.12"
