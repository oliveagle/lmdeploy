# LMDeploy Rust API Server - Default Configuration

[server]
http_addr = "0.0.0.0"
http_port = 8000
grpc_addr = "0.0.0.0"
grpc_port = 50051
workers = 4

# HTTP/2 Configuration
http2_enabled = true
http2_keepalive_interval_secs = 60
http2_keepalive_timeout_secs = 10

# Connection Pool
max_connections = 10000
connection_timeout_secs = 30
request_timeout_secs = 300

# Streaming Configuration
stream_timeout_secs = 600
stream_keepalive_interval_ms = 30000
stream_max_chunk_tokens = 8

# Batching
batch_enabled = true
batch_size = 8
batch_timeout_ms = 50

# Graceful Shutdown
shutdown_timeout_secs = 30

[model]
model_path = "/mnt/eaget-4tb/modelscope_models/tclf90/Qwen3___6-35B-A3B-AWQ"
model_name = "qwen3.6-35B-A3B-AWQ"
max_context_length = 8192
max_batch_size = 8

[cache]
tokenizer_cache_size = 1000
tokenizer_ttl_secs = 3600

[logging]
level = "info"
json_format = false

[metrics]
enabled = true
host = "0.0.0.0"
port = 9092
