syntax = "proto3";

package lmdeploy.v1;

// LMDeploy gRPC service definition — compatible with Python OpenAI API
service LMDeployService {
  // Chat completions (OpenAI-compatible)
  rpc ChatCompletion(ChatCompletionRequest) returns (ChatCompletionResponse);

  // Streaming chat completions (SSE-like via server stream)
  rpc ChatCompletionStream(ChatCompletionRequest) returns (stream ChatCompletionStreamResponse);

  // Text completions (non-streaming)
  rpc Completion(CompletionRequest) returns (CompletionResponse);

  // Text completions (streaming)
  rpc CompletionStream(CompletionRequest) returns (stream CompletionStreamResponse);

  // Batch chat completions
  rpc ChatCompletionBatch(BatchChatCompletionRequest) returns (BatchChatCompletionResponse);

  // Embeddings
  rpc Embeddings(EmbeddingsRequest) returns (EmbeddingsResponse);

  // Encode (tokenize)
  rpc Encode(EncodeRequest) returns (EncodeResponse);

  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);

  // Model info
  rpc ModelInfo(ModelInfoRequest) returns (ModelInfoResponse);
}

// ==================== Chat Completion ====================

message ChatCompletionRequest {
  string model = 1;
  repeated ChatMessage messages = 2;
  float temperature = 3;
  float top_p = 4;
  int32 top_k = 5;
  int32 max_tokens = 6;
  int32 n = 7;
  repeated string stop = 8;
  bool stream = 9;
  float presence_penalty = 10;
  float frequency_penalty = 11;
  int32 seed = 12;
  bool logprobs = 13;
  int32 top_logprobs = 14;
  bool stream_options_include_usage = 15;
  repeated Tool tools = 16;
  string tool_choice = 17;  // "auto", "required", "none", or tool name
  float repetition_penalty = 18;
  bool ignore_eos = 19;
  bool skip_special_tokens = 20;
  bool spaces_between_special_tokens = 21;
  int32 session_id = 22;
  bool do_preprocess = 23;
  string response_format = 24;  // "text", "json_object"
  bool enable_thinking = 25;
  float min_p = 26;
  int32 min_new_tokens = 27;
}

message ChatMessage {
  string role = 1;       // "user", "assistant", "system", "tool"
  string content = 2;
  string reasoning_content = 3;
  repeated ToolCall tool_calls = 4;
}

message ToolCall {
  string id = 1;
  string type = 2;  // "function"
  FunctionCall function = 3;
}

message FunctionCall {
  string name = 1;
  string arguments = 2;  // JSON string
}

message ChatCompletionResponse {
  string id = 1;
  string object = 2;  // "chat.completion"
  int64 created = 3;
  string model = 4;
  repeated ChatCompletionResponseChoice choices = 5;
  UsageInfo usage = 6;
}

message ChatCompletionResponseChoice {
  int32 index = 1;
  ChatMessage message = 2;
  ChoiceLogprobs logprobs = 3;
  string finish_reason = 4;  // "stop", "length", "tool_calls", "error", "abort"
}

message ChoiceLogprobs {
  repeated ChatCompletionTokenLogprob content = 1;
}

message ChatCompletionTokenLogprob {
  string token = 1;
  bytes token_bytes = 2;
  float logprob = 3;
  repeated TopLogprob top_logprobs = 4;
}

message TopLogprob {
  string token = 1;
  bytes token_bytes = 2;
  float logprob = 3;
}

message ChatCompletionStreamResponse {
  string id = 1;
  string object = 2;  // "chat.completion.chunk"
  int64 created = 3;
  string model = 4;
  repeated ChatCompletionResponseStreamChoice choices = 5;
  UsageInfo usage = 6;
}

message ChatCompletionResponseStreamChoice {
  int32 index = 1;
  DeltaMessage delta = 2;
  ChoiceLogprobs logprobs = 3;
  string finish_reason = 4;
}

message DeltaMessage {
  string role = 1;
  string content = 2;
  string reasoning_content = 3;
  repeated DeltaToolCall tool_calls = 4;
}

message DeltaToolCall {
  string id = 1;
  int32 index = 2;
  string type = 3;  // "function"
  DeltaFunctionCall function = 4;
}

message DeltaFunctionCall {
  string name = 1;
  string arguments = 2;
}

message BatchChatCompletionRequest {
  repeated ChatCompletionRequest requests = 1;
  int32 batch_size = 2;
}

message BatchChatCompletionResponse {
  repeated ChatCompletionResponse responses = 1;
  float total_latency_ms = 2;
  float throughput_tokens_per_second = 3;
}

// ==================== Completion ====================

message CompletionRequest {
  string model = 1;
  string prompt = 2;
  repeated int32 prompt_token_ids = 3;
  string suffix = 4;
  float temperature = 5;
  int32 n = 6;
  int32 max_tokens = 7;
  repeated string stop = 8;
  bool stream = 9;
  float top_p = 10;
  bool echo = 11;
  float presence_penalty = 12;
  float frequency_penalty = 13;
  int32 seed = 14;
  float repetition_penalty = 15;
  bool ignore_eos = 16;
  bool skip_special_tokens = 17;
  int32 top_k = 18;
  float min_p = 19;
  int32 session_id = 20;
  int32 top_logprobs = 21;
}

message CompletionResponse {
  string id = 1;
  string object = 2;  // "text_completion"
  int64 created = 3;
  string model = 4;
  repeated CompletionResponseChoice choices = 5;
  UsageInfo usage = 6;
}

message CompletionResponseChoice {
  int32 index = 1;
  string text = 2;
  LogProbs logprobs = 3;
  repeated int32 gen_tokens = 4;
  string finish_reason = 5;  // "stop", "length", "error", "abort"
}

message LogProbs {
  repeated int32 text_offset = 1;
  repeated float token_logprobs = 2;
  repeated string tokens = 3;
  repeated map<string, float> top_logprobs = 4;
}

message CompletionStreamResponse {
  string id = 1;
  string object = 2;  // "text_completion"
  int64 created = 3;
  string model = 4;
  repeated CompletionResponseStreamChoice choices = 5;
  UsageInfo usage = 6;
}

message CompletionResponseStreamChoice {
  int32 index = 1;
  string text = 2;
  LogProbs logprobs = 3;
  repeated int32 gen_tokens = 4;
  string finish_reason = 5;
}

// ==================== Embeddings ====================

message EmbeddingsRequest {
  string model = 1;
  repeated string inputs = 2;  // text or list of texts
}

message EmbeddingsResponse {
  string object = 1;  // "list"
  repeated EmbeddingData data = 2;
  string model = 3;
  UsageInfo usage = 4;
}

message EmbeddingData {
  string object = 1;   // "embedding"
  repeated float embedding = 2;
  int32 index = 3;
}

// ==================== Encode ====================

message EncodeRequest {
  string input = 1;
  bool do_preprocess = 2;
  bool add_bos = 3;
}

message EncodeResponse {
  repeated int32 input_ids = 1;
  int32 length = 2;
}

// ==================== Health & Model Info ====================

message HealthRequest {}

message HealthResponse {
  string status = 1;   // "ok", "degraded", "error"
  string version = 2;
  string model = 3;
  int64 uptime_seconds = 4;
}

message ModelInfoRequest {}

message ModelInfoResponse {
  string model_name = 1;
  string model_path = 2;
  int32 max_context_length = 3;
  int32 vocab_size = 4;
  bool supports_streaming = 5;
  repeated string capabilities = 6;
}

// ==================== Common Types ====================

message UsageInfo {
  int32 prompt_tokens = 1;
  int32 total_tokens = 2;
  int32 completion_tokens = 3;
}
